<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Maikol Romero — DevSecOps Engineer & SOC Architect">
  <defs>
    <!-- Glow para neón -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradientes -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a1a"/>
      <stop offset="50%" stop-color="#0f0a25"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff1493"/>
    </linearGradient>

    <!-- Patrón de grid -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2548" stroke-width="0.5" opacity="0.6"/>
    </pattern>

    <!-- Patrón de dots -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#2a3470" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Capa de fondo -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- Resplandor radial sutil -->
  <ellipse cx="640" cy="180" rx="500" ry="120" fill="#8a2be2" opacity="0.12"/>
  <ellipse cx="640" cy="180" rx="300" ry="80" fill="#00ffff" opacity="0.08"/>

  <!-- Línea de escaneo animada -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#scanGrad)" opacity="0.7">
    <animate attributeName="y" from="-2" to="360" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Brackets cyberpunk en esquinas -->
  <path d="M 18 18 L 18 60 M 18 18 L 60 18" stroke="#00ffff" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>
  <path d="M 1262 18 L 1262 60 M 1262 18 L 1220 18" stroke="#00ffff" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>
  <path d="M 18 342 L 18 300 M 18 342 L 60 342" stroke="#ff1493" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>
  <path d="M 1262 342 L 1262 300 M 1262 342 L 1220 342" stroke="#ff1493" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>

  <!-- Status bar superior -->
  <text x="50" y="48" fill="#00ffff" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" filter="url(#softGlow)" letter-spacing="2">
    [ SOC // COMMAND_CENTER ]
  </text>

  <!-- Indicador ONLINE pulsante -->
  <g transform="translate(1130, 38)">
    <circle cx="0" cy="6" r="5" fill="#00ff66" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="11" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="2">SYSTEM ONLINE</text>
  </g>

  <!-- Nombre principal con efecto glitch (capas con offset y blend) -->
  <g filter="url(#glow)">
    <!-- Capa cyan offset -->
    <text x="638" y="148" fill="#00ffff" opacity="0.55" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="3">MAIKOL_ROMERO</text>
    <!-- Capa magenta offset -->
    <text x="642" y="152" fill="#ff1493" opacity="0.55" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="3">MAIKOL_ROMERO</text>
    <!-- Capa principal -->
    <text x="640" y="150" fill="url(#nameGrad)" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="3">MAIKOL_ROMERO</text>
  </g>

  <!-- Subtítulo -->
  <text x="640" y="195" fill="#a0aec0" font-family="'JetBrains Mono', monospace" font-size="16" text-anchor="middle" letter-spacing="6" font-weight="500">
    DEVSECOPS  ·  SOC ARCHITECT  ·  ETHICAL HACKER
  </text>

  <!-- Línea separadora -->
  <line x1="200" y1="225" x2="1080" y2="225" stroke="#2a3470" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Tres tarjetas KPI -->
  <!-- KPI 1: PENTEST -->
  <g transform="translate(190, 250)">
    <rect width="280" height="80" fill="#0a0d22" stroke="#00ffff" stroke-width="1" rx="4" opacity="0.85"/>
    <rect x="0" y="0" width="3" height="80" fill="#00ffff" filter="url(#softGlow)"/>
    <text x="18" y="28" fill="#7c8db5" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">&gt; OFFENSIVE_OPS</text>
    <text x="18" y="58" fill="#00ffff" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" filter="url(#softGlow)">PENTEST_MODE</text>
    <circle cx="258" cy="20" r="3" fill="#00ffff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- KPI 2: SIEM -->
  <g transform="translate(500, 250)">
    <rect width="280" height="80" fill="#0a0d22" stroke="#8a2be2" stroke-width="1" rx="4" opacity="0.85"/>
    <rect x="0" y="0" width="3" height="80" fill="#8a2be2" filter="url(#softGlow)"/>
    <text x="18" y="28" fill="#7c8db5" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">&gt; SIEM_STATUS</text>
    <text x="18" y="58" fill="#bf7fff" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" filter="url(#softGlow)">MONITORING</text>
    <circle cx="258" cy="20" r="3" fill="#bf7fff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- KPI 3: COMPLIANCE -->
  <g transform="translate(810, 250)">
    <rect width="280" height="80" fill="#0a0d22" stroke="#ff1493" stroke-width="1" rx="4" opacity="0.85"/>
    <rect x="0" y="0" width="3" height="80" fill="#ff1493" filter="url(#softGlow)"/>
    <text x="18" y="28" fill="#7c8db5" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">&gt; COMPLIANCE</text>
    <text x="18" y="58" fill="#ff66c4" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" filter="url(#softGlow)">RGPD · PCI · ENS</text>
    <circle cx="258" cy="20" r="3" fill="#ff66c4">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
